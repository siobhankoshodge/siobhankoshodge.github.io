  :root{
    --ink:#4A4453;        /* soft plum-grey text */
    --line:transparent;   /* outlines retired — soft shadows instead */
    --soft:#6B5D52;
    --paper:#F5F2F8;      /* light neutral fill inside white cards */
    --card:#FFFFFF;
    --wk-bg:#FFF3C4;      /* weekend pastel yellow */
    --wk-num:#2E7CE6;     /* weekend blue numbers */
    --m-main:#2FB944;     /* month colour (JS swaps these) */
    --m-tint:#DFF7DC;
    --m-deep:#1F8A30;
    --wobble: 22px;
    --wobble2: 26px;
    --shadow-s: 0 2px 8px rgba(74,68,83,.09);
    --shadow-m: 0 6px 20px rgba(74,68,83,.13);
    --shadow-l: 0 14px 36px rgba(74,68,83,.17);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:'Baloo 2',"Comic Sans MS","Comic Neue",cursive;
    font-weight:500;
    background:var(--m-tint);
    background-image:
      linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.72)),
      radial-gradient(rgba(255,255,255,.55) 2.4px, transparent 2.8px);
    background-size:auto, 24px 24px;
    background-attachment:fixed;
    color:var(--ink);
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  /* ---------- top bar ---------- */
  header{
    display:flex; align-items:center; justify-content:center; gap:14px;
    padding:14px 10px 4px; position:relative; flex-wrap:wrap;
  }
  .nav-btn{
    font-family:inherit; font-size:26px; font-weight:700; line-height:1;
    width:58px; height:58px; border:none;
    border-radius:50%;
    background:var(--m-main); color:#fff; cursor:pointer;
    box-shadow:0 5px 0 var(--m-deep), var(--shadow-s);
    transition:transform .12s, box-shadow .12s;
  }
  .nav-btn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--m-deep); }
  .title-wrap{ text-align:center; min-width:230px; position:relative; padding-top:26px; }
  #monthTitle{
    font-family:'Titan One',"Comic Sans MS",cursive;
    font-size:clamp(44px,8vw,72px); font-weight:400; margin:0; line-height:1.05;
    color:#fff; letter-spacing:2px;
    text-shadow:0 4px 0 var(--m-deep), 0 10px 22px rgba(74,68,83,.22);
  }
  #yearTitle{ font-family:'Titan One',"Comic Sans MS",cursive; font-size:19px; font-weight:400; letter-spacing:1px; color:var(--m-deep); margin:0; }
  /* sketch helpers: bird + smiley perched by the title */
  .helper{ position:absolute; width:52px; height:52px; pointer-events:none; }
  .helper.bird{ top:-14px; left:4px; animation:bob 2.6s ease-in-out infinite; }
  .helper.smiley{ top:-10px; right:4px; font-size:36px; animation:bob 3.1s .5s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-4deg);} 50%{ transform:translateY(-7px) rotate(5deg);} }
  @media (prefers-reduced-motion: reduce){ .helper{ animation:none !important; } .pop-in{ animation:none !important; } }

  .top-actions{ display:flex; gap:10px; align-items:center; }
  .round-btn{
    font-family:inherit; font-size:22px; width:52px; height:52px; cursor:pointer;
    border:none; border-radius:50%;
    background:var(--card); box-shadow:var(--shadow-m);
    transition:transform .12s;
  }
  .round-btn:active{ transform:scale(.9); }
  #todayBtn{ width:auto; padding:0 16px; font-weight:bold; font-size:17px; color:var(--m-deep); }

  /* ---------- view tabs ---------- */
  .tabs{ display:flex; justify-content:center; gap:12px; padding:10px 8px 6px; }
  .tab{
    font-family:'Titan One',"Comic Sans MS",cursive; font-size:clamp(15px,3vw,19px); font-weight:400; letter-spacing:.5px; cursor:pointer;
    padding:12px 24px; border:none; border-radius:999px;
    background:var(--card); color:var(--ink);
    box-shadow:var(--shadow-s); min-width:96px;
    transition:transform .12s, box-shadow .12s;
  }
  .tab.active{ background:var(--m-main); color:#fff; box-shadow:0 4px 0 var(--m-deep); transform:scale(1.06); }

  /* ---------- main layout ---------- */
  .layout{ display:grid; grid-template-columns:212px 1fr; gap:12px; padding:10px 12px 26px; max-width:1180px; margin:0 auto; }
  @media (max-width:760px){
    .layout{ grid-template-columns:1fr; }
    aside{ order:2; }
  }

  /* ---------- sticker sidebar ---------- */
  aside{
    background:var(--card); border:none; border-radius:var(--wobble2);
    box-shadow:var(--shadow-m);
    padding:14px 12px; align-self:start; position:sticky; top:8px;
    max-height:calc(100vh - 20px); overflow-y:auto;
  }
  @media (max-width:760px){ aside{ position:static; max-height:none; } }
  .side-title{ font-family:'Titan One',"Comic Sans MS",cursive; font-size:17px; font-weight:400; letter-spacing:.5px; text-align:center; margin:2px 0 8px; color:var(--m-deep); }
  .pack-name{
    display:flex; width:100%; align-items:center; gap:6px; cursor:pointer;
    border:none; background:var(--paper); border-radius:999px;
    padding:8px 12px; margin:10px 0 6px;

  .sticker-btn{

<script>

const KEY = 'rainbow-cal-v1';
let data = { stickers:{}, notes:{}, events:[], sound:true };
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved && typeof saved === 'object') data = Object.assign(data, saved);
} catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

const today = new Date();
let view = 'month';
let cur = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };

function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(y,m,d){ return y + '-' + pad(m+1) + '-' + pad(d); }
function fromKey(k){ const p = k.split('-').map(Number); return { y:p[0], m:p[1]-1, d:p[2] }; }
function daysIn(y,m){ return new Date(y, m+1, 0).getDate(); }
function dowMon(y,m,d){ return (new Date(y,m,d).getDay() + 6) % 7; } /* Mon=0 .. Sun=6 */
function isWknd(y,m,d){ return dowMon(y,m,d) >= 5; }
function isToday(y,m,d){ return y===today.getFullYear() && m===today.getMonth() && d===today.getDate(); }
function cmpKey(a,b){ return a < b ? -1 : a > b ? 1 : 0; }

/* =============== sounds (WebAudio) =============== */
let actx = null;
function ac(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, dur, type, vol, when, slideTo){
  const c = ac(); if(!c || !data.sound) return;
  const t0 = c.currentTime + (when||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol||.15, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + .02);
}
const sPop    = () => { tone(420, .12, 'sine', .22, 0, 720); };
const sUnpop  = () => { tone(500, .15, 'sine', .18, 0, 200); };
const sChime  = () => { tone(660, .18, 'triangle', .16); tone(880, .22, 'triangle', .16, .09); tone(1100, .3, 'triangle', .14, .18); };
const sTada   = () => { [523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.15,i*.08)); };
const sClick  = () => { tone(300, .05, 'square', .06); };

/* =============== theming =============== */
function applyTheme(){
  const M = MONTHS[cur.m];
  const r = document.documentElement.style;
  r.setProperty('--m-main', M.main);
  r.setProperty('--m-tint', M.tint);
  r.setProperty('--m-deep', M.deep);
  document.getElementById('monthTitle').textContent = M.name;
  document.getElementById('yearTitle').textContent = cur.y;
}

/* =============== rendering helpers =============== */
function art(id){
  const s = STICKER_MAP[id]; if(!s) return '';
  return `<span class="stx">${s.art}</span>`;
}
function eventsOn(k){
  return data.events.filter(e => cmpKey(e.start,k) <= 0 && cmpKey(k,e.end) <= 0);
}

const mainEl = document.getElementById('main');

function render(){
  applyTheme();
  document.body.dataset.view = view;
  if (view !== 'month' && markerColor){
    markerColor = null;
    document.body.classList.remove('marker-on');
    document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
  }
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
  if (view === 'month') renderMonth();
  else if (view === 'week') renderWeek();
  else renderDay();
}

/* ---------- MONTH ---------- */
function renderMonth(){
  const { y, m } = cur;
  let html = '<div class="dow-row">' + DOWS.map((d,i) =>
    `<div class="dow${i>=5?' wknd':''}">${d}</div>`).join('') + '</div><div class="grid">';
  const lead = dowMon(y, m, 1);
  for (let i=0;i<lead;i++) html += '<div class="cell blank"></div>';
  const n = daysIn(y,m);
  for (let d=1; d<=n; d++){
    const k = keyOf(y,m,d);
    const wk = isWknd(y,m,d);
    const stx = data.stickers[k] || [];
    const evs = eventsOn(k);
    let cls = 'cell' + (wk?' wknd':'') + (isToday(y,m,d)?' today':'');
    html += `<div class="${cls}" data-day="${d}" data-key="${k}">`;
    html += `<span class="num">${d}</span>`;
    evs.slice(0,2).forEach(e => {
      const isStart = e.start === k || dowMon(y,m,d) === 0 || d === 1;
      const isEnd = e.end === k || dowMon(y,m,d) === 6 || d === n;
      let ec = 'ev-chip' + (isStart ? ' ev-start' : ' ev-mid') + (isEnd ? ' ev-end' : ' ev-notend');
      html += `<div class="${ec}" style="background-color:${e.color}">${isStart ? e.icon + ' ' + e.name : ''}</div>`;
    });
    const shown = stx.slice(0,4);
    html += '<div class="cell-stx">' + shown.map(id => art(id)).join('') +
      (stx.length > 4 ? `<span class="more-badge">+${stx.length-4}</span>` : '') + '</div>';
    html += '</div>';
  }
  html += '</div>';
  mainEl.innerHTML = html;
}

/* ---------- WEEK ---------- */
function weekDates(){
  const back = dowMon(cur.y, cur.m, cur.d);
  const start = new Date(cur.y, cur.m, cur.d - back);
  return Array.from({length:7}, (_,i) => {
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    return { y:dt.getFullYear(), m:dt.getMonth(), d:dt.getDate() };
  });
}
function renderWeek(){
  const days = weekDates();
  let html = '<div class="week-wrap"><div class="week-row">';
  days.forEach((o,i) => {
    const k = keyOf(o.y,o.m,o.d);
    const stx = data.stickers[k] || [];
    const evs = eventsOn(k);
    const note = data.notes[k] || '';
    let cls = 'wcol' + (i>=5?' wknd':'') + (isToday(o.y,o.m,o.d)?' today':'');
    html += `<div class="${cls}" data-key="${k}"><h3>${DOWS[i]} ${o.d}</h3>`;
    evs.forEach(e => {
      html += `<div class="ev-chip ev-start ev-end" style="background-color:${e.color}">${e.icon} ${e.name}</div>`;
    });
    html += '<div class="cell-stx">' + stx.map(id => art(id)).join('') + '</div>';
    if (note) html += `<div class="wnote">📝 ${escapeHtml(note)}</div>`;
    html += '</div>';
  });
  html += '</div></div>';
  mainEl.innerHTML = html;
}

/* ---------- DAY ---------- */
function renderDay(){
  const { y, m, d } = cur;
  const k = keyOf(y,m,d);
  const stx = data.stickers[k] || [];
  const evs = eventsOn(k);
  const wk = isWknd(y,m,d);
  const dname = DOWS[dowMon(y,m,d)];
  const longNames = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday', Sat:'Saturday', Sun:'Sunday' };
  let html = `<div class="day-page"><div class="day-head">
    <p class="big-num">${d}</p>
    <p class="dname${wk?' wknd':''}">${longNames[dname]}${wk ? ' 🎉 Weekend!' : ''}</p>
  </div><div class="day-evs">`;
  evs.forEach(e => {
    html += `<div class="day-ev" style="background-color:${e.color}"><span>${e.icon}</span><span>${escapeHtml(e.name)}</span>
      <button data-delev="${e.id}" aria-label="Remove event">✖</button></div>`;
  });
  html += '</div>';
  html += '<div class="day-stx" id="dayStx">';
  if (stx.length === 0) html += '<div class="empty-hint">No stickers yet!<br>Tap a sticker in the Sticker Box to add one ✨</div>';
  stx.forEach((id,i) => { html += `<span class="placed" data-idx="${i}" title="Tap to remove">${art(id)}</span>`; });
  html += '</div>';
  if (stx.length > 0) html += '<p class="remove-hint">Tap a sticker to take it off 👆</p>';
  html += `<textarea class="day-note" id="dayNote" maxlength="200" placeholder="Write a little note… ✏️">${escapeHtml(data.notes[k]||'')}</textarea>`;
  html += '</div>';
  mainEl.innerHTML = html;

  const noteEl = document.getElementById('dayNote');
  noteEl.addEventListener('input', () => {
    if (noteEl.value.trim()) data.notes[k] = noteEl.value; else delete data.notes[k];
    save();
  });
}

function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* =============== sticker placement =============== */
function addSticker(k, id){
  (data.stickers[k] = data.stickers[k] || []).push(id);
  save();
  if (PARTY_IDS.includes(id)) { sTada(); confetti(); toast('🎂 Party day!'); }
  else sPop();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.style.display = 'none', 1600);
}
function confetti(){
  const bits = ['🎉','🎈','⭐','🎊','✨'];
  for (let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    el.textContent = bits[i % bits.length];
    const x = 20 + Math.random()*60;
    el.style.left = x + 'vw'; el.style.top = '-30px';
    document.body.appendChild(el);
    const fall = 60 + Math.random()*35;
    const drift = (Math.random()-.5) * 160;
    const dur = 1400 + Math.random()*1200;
    el.animate([
      { transform:'translate(0,0) rotate(0deg)' },
      { transform:`translate(${drift}px, ${fall}vh) rotate(${360 + Math.random()*360}deg)` }
    ], { duration:dur, easing:'ease-in' }).onfinish = () => el.remove();
  }
}

  se.addEventListener('input', () => {
    const q = se.value.trim().toLowerCase();
    wrap.querySelectorAll('.sticker-btn').forEach(b => {
      b.style.display = !q || b.title.toLowerCase().includes(q) ? '' : 'none';
    });
    wrap.querySelectorAll('.pack').forEach(pk => {
      const header = wrap.querySelector(`.pack-name[data-pack="${pk.dataset.packbody}"]`);
      if (q){
        const any = Array.from(pk.querySelectorAll('.sticker-btn')).some(b => b.style.display !== 'none');
        pk.classList.toggle('closed', !any);
        header.classList.toggle('open', any);
        header.style.display = any ? '' : 'none';
      } else {
        header.style.display = '';
      }
    });
  });

  const sw = document.getElementById('swatches');
  sw.innerHTML = MARKER_COLORS.map(c => `<button class="swatch" data-color="${c}" style="background:${c}" aria-label="Marker colour"></button>`).join('');
  document.getElementById('birdHelper').innerHTML = SVG_BIRD;
})();

/* =============== drag & drop (pointer events) =============== */
const ghost = document.getElementById('ghost');
let drag = null;          /* { sid } */
let markerColor = null;
let range = null;         /* { anchor, focus } keys */
let pendingRange = null;

function cellAt(x,y){
  const el = document.elementFromPoint(x,y);
  return el ? el.closest('.cell:not(.blank), .wcol') : null;
}

document.addEventListener('pointerdown', ev => {
  ac(); /* unlock audio */
  const sbtn = ev.target.closest('.sticker-btn');
  if (sbtn){
    ev.preventDefault();
    /* In Day view a simple tap adds the sticker straight to the page */
    drag = { sid: sbtn.dataset.sid, sx: ev.clientX, sy: ev.clientY, moved:false };
    ghost.innerHTML = sbtn.innerHTML;
    return;
  }
  const cell = ev.target.closest('.cell:not(.blank)');
  if (cell && markerColor && view === 'month'){
    ev.preventDefault();
    range = { anchor: cell.dataset.key, focus: cell.dataset.key };
    paintRange();
  }
});

document.addEventListener('pointermove', ev => {
  if (drag){
    if (!drag.moved && Math.hypot(ev.clientX-drag.sx, ev.clientY-drag.sy) > 8){
      drag.moved = true; ghost.style.display = 'block';
    }
    if (drag.moved){
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top  = ev.clientY + 'px';
      document.querySelectorAll('.drop-hot').forEach(c => c.classList.remove('drop-hot'));
      const c = cellAt(ev.clientX, ev.clientY);
      if (c) c.classList.add('drop-hot');
    }
  } else if (range){
    const c = cellAt(ev.clientX, ev.clientY);
    if (c && c.dataset.key && c.dataset.key !== range.focus){
      range.focus = c.dataset.key;
      paintRange();
    }
  }
});

document.addEventListener('pointerup', ev => {
  if (drag){
    ghost.style.display = 'none';
    document.querySelectorAll('.drop-hot').forEach(c => c.classList.remove('drop-hot'));
    if (drag.moved){
      const c = cellAt(ev.clientX, ev.clientY);
      if (c && c.dataset.key){
        addSticker(c.dataset.key, drag.sid);
        render();
      }
    } else {
      /* plain tap on a palette sticker */
      if (view === 'day'){
        addSticker(keyOf(cur.y,cur.m,cur.d), drag.sid);
        render();
      } else {
        sClick();
        toast('Drag me onto a day! 👉');
      }
    }
    drag = null;
    return;
  }
  if (range){
    const lo = cmpKey(range.anchor, range.focus) <= 0 ? range.anchor : range.focus;
    const hi = lo === range.anchor ? range.focus : range.anchor;
    pendingRange = { start: lo, end: hi, color: markerColor };
    range = null;
    clearRangePaint();
    openEventPopup();
  }
});
document.addEventListener('pointercancel', () => {
  if (drag){ ghost.style.display='none'; drag = null; }
  if (range){ range = null; clearRangePaint(); }
  document.querySelectorAll('.drop-hot').forEach(c => c.classList.remove('drop-hot'));
});

function paintRange(){
  if (!range) return;
  const lo = cmpKey(range.anchor, range.focus) <= 0 ? range.anchor : range.focus;
  const hi = lo === range.anchor ? range.focus : range.anchor;
  document.querySelectorAll('.cell[data-key]').forEach(c => {
    const k = c.dataset.key;
    const inR = cmpKey(lo,k) <= 0 && cmpKey(k,hi) <= 0;
    c.classList.toggle('range-hot', inR);
    if (inR) c.style.setProperty('--rangeC', markerColor);
  });
}
function clearRangePaint(){
  document.querySelectorAll('.range-hot').forEach(c => c.classList.remove('range-hot'));
}

/* =============== marker mode =============== */
document.getElementById('swatches').addEventListener('click', ev => {
  const s = ev.target.closest('.swatch'); if (!s) return;
  markerColor = s.dataset.color;
  document.querySelectorAll('.swatch').forEach(x => x.classList.toggle('sel', x === s));
  document.body.classList.add('marker-on');
  sClick();
  if (view !== 'month'){ view = 'month'; render(); }
  toast('🖍️ Now drag across some days!');
});
document.getElementById('markerOff').addEventListener('click', () => {
  markerColor = null;
  document.body.classList.remove('marker-on');
  document.querySelectorAll('.swatch').forEach(x => x.classList.remove('sel'));
  sClick();
});

/* =============== event popup =============== */
const overlay = document.getElementById('evOverlay');
(function buildPresets(){
  document.getElementById('presetGrid').innerHTML = EVENT_PRESETS.map((p,i) =>
    `<button class="preset" data-pi="${i}">${p.icon} ${p.name}</button>`).join('');
})();
function openEventPopup(){
  if (!pendingRange) return;
  const a = fromKey(pendingRange.start), b = fromKey(pendingRange.end);
  const txt = a.d === b.d && a.m === b.m
    ? `On the ${a.d}th`
    : `From ${MONTHS[a.m].name} ${a.d} to ${MONTHS[b.m].name} ${b.d}`;
  document.getElementById('evRangeText').textContent = txt;
  document.getElementById('evCustom').value = '';
  overlay.classList.add('show');
}
function closePopup(){ overlay.classList.remove('show'); pendingRange = null; }
function createEvent(name, icon){
  if (!pendingRange) return;
  data.events.push({
    id: 'e' + Date.now(),
    start: pendingRange.start, end: pendingRange.end,
    color: pendingRange.color, name: name, icon: icon
  });
  save();
  overlay.classList.remove('show');
  pendingRange = null;
  sChime();
  if (icon === '🎂') confetti();
  render();
}
document.getElementById('presetGrid').addEventListener('click', ev => {
  const b = ev.target.closest('.preset'); if (!b) return;
  const p = EVENT_PRESETS[+b.dataset.pi];
  createEvent(p.name, p.icon);
});
document.getElementById('evCustomGo').addEventListener('click', () => {
  const v = document.getElementById('evCustom').value.trim();
  if (v) createEvent(v, '🖍️');
});
document.getElementById('evCustom').addEventListener('keydown', ev => {
  if (ev.key === 'Enter'){ ev.preventDefault(); document.getElementById('evCustomGo').click(); }
});
document.getElementById('evCancel').addEventListener('click', () => { closePopup(); sClick(); });

/* =============== clicks in the main area =============== */
mainEl.addEventListener('click', ev => {
  /* remove an event (day view) */
  const del = ev.target.closest('[data-delev]');
  if (del){
    data.events = data.events.filter(e => e.id !== del.dataset.delev);
    save(); sUnpop(); render();
    return;
  }
  /* remove a sticker (day view) */
  const placed = ev.target.closest('.placed');
  if (placed){
    const k = keyOf(cur.y,cur.m,cur.d);
    const arr = data.stickers[k] || [];
    arr.splice(+placed.dataset.idx, 1);
    if (arr.length === 0) delete data.stickers[k];
    save(); sUnpop(); render();
    return;
  }
  if (markerColor) return; /* marker mode: drags only */
  /* open a day */
  const cell = ev.target.closest('.cell:not(.blank), .wcol');
  if (cell && cell.dataset.key){
    const o = fromKey(cell.dataset.key);
    cur = o; view = 'day';
    sClick(); render();
    return;
  }
});

/* =============== nav =============== */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  view = t.dataset.view; sClick(); render();
}));
function shift(dir){
  if (view === 'month'){
    const m = cur.m + dir;
    cur = { y: cur.y + Math.floor(m/12), m: ((m%12)+12)%12, d: 1 };
    if (cur.y === today.getFullYear() && cur.m === today.getMonth()) cur.d = today.getDate();
  } else if (view === 'week'){
    const dt = new Date(cur.y, cur.m, cur.d + dir*7);
    cur = { y:dt.getFullYear(), m:dt.getMonth(), d:dt.getDate() };
  } else {
    const dt = new Date(cur.y, cur.m, cur.d + dir);
    cur = { y:dt.getFullYear(), m:dt.getMonth(), d:dt.getDate() };
  }
  sClick(); render();
}
document.getElementById('prevBtn').addEventListener('click', () => shift(-1));
document.getElementById('nextBtn').addEventListener('click', () => shift(1));
document.getElementById('todayBtn').addEventListener('click', () => {
  cur = { y: today.getFullYear(), m: today.getMonth(), d: today.getDate() };
  sChime(); render();
});
const soundBtn = document.getElementById('soundBtn');
function paintSound(){ soundBtn.textContent = data.sound ? '🔊' : '🔇'; }
soundBtn.addEventListener('click', () => { data.sound = !data.sound; save(); paintSound(); if(data.sound) sPop(); });
paintSound();

/* =============== Gem Pop! mini game =============== */
const GT = ['diamond','ball','creeper','star','rainbow'];
const GN = 7;
let gB = null, gScore = 0, gBusy = false, gSel = null, gDrag = null;

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }
function randT(){ return Math.floor(Math.random() * GT.length); }

function gNewBoard(){
  gB = Array.from({length:GN}, () => Array(GN).fill(0));
  for (let r=0;r<GN;r++) for (let c=0;c<GN;c++){
    let t;
    do { t = randT(); }
    while ((c>=2 && gB[r][c-1]===t && gB[r][c-2]===t) ||
           (r>=2 && gB[r-1][c]===t && gB[r-2][c]===t));
    gB[r][c] = t;
  }
  if (!gHasMove()) return gNewBoard();
}
function gInit(){ gNewBoard(); gScore = 0; gSel = null; gBusy = false; gPaint(); }

function gPaint(popSet){
  const bd = document.getElementById('gboard');
  let html = '';
  for (let r=0;r<GN;r++) for (let c=0;c<GN;c++){
    const cls = 'gtile'
      + (gSel && gSel[0]===r && gSel[1]===c ? ' gsel' : '')
      + (popSet && popSet.has(r+','+c) ? ' gpop' : '');
    html += `<button class="${cls}" data-r="${r}" data-c="${c}">${art(GT[gB[r][c]])}</button>`;
  }
  bd.innerHTML = html;
  document.getElementById('gscore').textContent = gScore;
  document.getElementById('gbest').textContent = data.gameBest || 0;
}

function gMatches(){
  const s = new Set();
  for (let r=0;r<GN;r++){
    let run = 1;
    for (let c=1;c<=GN;c++){
      if (c<GN && gB[r][c] === gB[r][c-1]) run++;
      else { if (run>=3) for (let k=c-run;k<c;k++) s.add(r+','+k); run = 1; }
    }
  }
  for (let c=0;c<GN;c++){
    let run = 1;
    for (let r=1;r<=GN;r++){
      if (r<GN && gB[r][c] === gB[r-1][c]) run++;
      else { if (run>=3) for (let k=r-run;k<r;k++) s.add(k+','+c); run = 1; }
    }
  }
  return s;
}

function gHasMove(){
  const dirs = [[0,1],[1,0]];
  for (let r=0;r<GN;r++) for (let c=0;c<GN;c++) for (const [dr,dc] of dirs){
    const r2 = r+dr, c2 = c+dc;
    if (r2>=GN || c2>=GN) continue;
    [gB[r][c], gB[r2][c2]] = [gB[r2][c2], gB[r][c]];
    const hit = gMatches().size > 0;
    [gB[r][c], gB[r2][c2]] = [gB[r2][c2], gB[r][c]];
    if (hit) return true;
  }
  return false;
}

async function gResolve(){
  gBusy = true;
  let combo = 0;
  let m = gMatches();
  while (m.size){
    combo++;
    gScore += m.size * 10 * combo;
    tone(360 + combo*140, .16, 'sine', .22, 0, 700 + combo*180);
    if (m.size >= 5 || combo >= 3) confetti();
    gPaint(m);
    await sleep(240);
    for (let c=0;c<GN;c++){
      const keep = [];
      for (let r=GN-1;r>=0;r--) if (!m.has(r+','+c)) keep.push(gB[r][c]);
      for (let i=0;i<GN;i++) gB[GN-1-i][c] = i < keep.length ? keep[i] : randT();
    }
    gPaint();
    await sleep(130);
    m = gMatches();
  }
  if ((data.gameBest||0) < gScore){ data.gameBest = gScore; save(); }
  if (!gHasMove()){
    toast('No more moves — shuffle! 🔀');
    await sleep(500);
    gNewBoard();
  }
  gPaint();
  gBusy = false;
}

async function gTrySwap(r1,c1,r2,c2){
  if (gBusy) return;
  if (r2<0 || c2<0 || r2>=GN || c2>=GN) return;
  if (Math.abs(r1-r2) + Math.abs(c1-c2) !== 1) return;
  gBusy = true;
  gSel = null;
  [gB[r1][c1], gB[r2][c2]] = [gB[r2][c2], gB[r1][c1]];
  gPaint();
  await sleep(100);
  if (gMatches().size === 0){
    sUnpop();
    [gB[r1][c1], gB[r2][c2]] = [gB[r2][c2], gB[r1][c1]];
    gPaint();
    gBusy = false;
  } else {
    gBusy = false;
    await gResolve();
  }
}

const gboardEl = document.getElementById('gboard');
gboardEl.addEventListener('click', ev => {
  if (gBusy) return;
  const t = ev.target.closest('.gtile');
  if (!t) return;
  const r = +t.dataset.r, c = +t.dataset.c;
  if (!gSel){ gSel = [r,c]; sClick(); gPaint(); return; }
  if (gSel[0]===r && gSel[1]===c){ gSel = null; gPaint(); return; }
  if (Math.abs(gSel[0]-r) + Math.abs(gSel[1]-c) === 1){
    gTrySwap(gSel[0], gSel[1], r, c);
  } else {
    gSel = [r,c]; sClick(); gPaint();
  }
});
gboardEl.addEventListener('pointerdown', ev => {
  const t = ev.target.closest('.gtile');
  if (!t || gBusy) return;
  gDrag = { r:+t.dataset.r, c:+t.dataset.c, x:ev.clientX, y:ev.clientY };
});
gboardEl.addEventListener('pointermove', ev => {
  if (!gDrag || gBusy) return;
  const dx = ev.clientX - gDrag.x, dy = ev.clientY - gDrag.y;
  if (Math.hypot(dx,dy) < 22) return;
  const d = Math.abs(dx) > Math.abs(dy) ? [0, dx>0?1:-1] : [dy>0?1:-1, 0];
  const from = gDrag; gDrag = null;
  gTrySwap(from.r, from.c, from.r + d[0], from.c + d[1]);
});
document.addEventListener('pointerup', () => { gDrag = null; });

const gameOverlay = document.getElementById('gameOverlay');
document.getElementById('gameBtn').addEventListener('click', () => {
  if (!gB) gInit(); else gPaint();
  gameOverlay.classList.add('show');
  sChime();
});
document.getElementById('gNew').addEventListener('click', () => { gInit(); sClick(); });
document.getElementById('gClose').addEventListener('click', () => {
  gameOverlay.classList.remove('show');
  sClick();
});

render();
</script>
